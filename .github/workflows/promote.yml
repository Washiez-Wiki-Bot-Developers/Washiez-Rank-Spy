name: Production Promotion Pipeline

on:
  push:
    branches:
      - main

jobs:
  promote-to-prod:
    runs-on: ubuntu-latest
    steps:
      # 1. Generate the temporary App Token
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # 2. Checkout the repo using that token
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # 3. Perform the merge and push
      - name: Update deploy/PROD
        run: |
          git config user.name "Washiez-Wiki-Bot[bot]"
          git config user.email "washiez-bot@users.noreply.github.com"
          
          git fetch origin deploy/PROD
          git checkout deploy/PROD
          
          # Merge main into PROD. Since the token was generated by the App, 
          # it will bypass your branch protection rules automatically.
          git merge origin/main --ff-only
          git push origin deploy/PROD