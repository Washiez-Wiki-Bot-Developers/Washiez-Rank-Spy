name: Production Promotion Pipeline

on:
  push:
    branches:
      - main

jobs:
  promote-to-prod:
    runs-on: ubuntu-latest
    steps:
      # 1. Generate the temporary App Token
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # 2. Checkout the repo using that token
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # 3. Perform the merge and push
      - name: Update deploy/PROD
        run: |
          git config user.name "Washiez-Wiki-Bot[bot]"
          git config user.email "washiez-bot@users.noreply.github.com"
          
          # Fetch the latest state of both branches
          git fetch origin main
          git fetch origin deploy/PROD
          
          # Switch to PROD
          git checkout deploy/PROD
          
          # Rebase main onto PROD. 
          # This keeps the bot's rank data history and applies code changes on top.
          # -X theirs tells Git: "If a file (like a rank log) conflicts, prefer the Main branch code."
          git rebase origin/main -X theirs
          
          # Force push is required because we are rewriting the history via rebase
          git push origin deploy/PROD --force-with-lease
